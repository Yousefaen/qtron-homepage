<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50">
  <!-- QI Symbol -->
  <g transform="translate(5, 5)">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#8f1a40" stroke-width="1.5"/>
    <!-- Middle circle -->
    <circle cx="20" cy="20" r="13" fill="none" stroke="#8f1a40" stroke-width="1.5"/>
    <!-- Inner circle -->
    <circle cx="20" cy="20" r="8" fill="none" stroke="#8f1a40" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="20" cy="20" r="3" fill="#8f1a40"/>
    <!-- Vertical line (I) -->
    <rect x="42" y="6" width="2.5" height="28" fill="#8f1a40"/>
  </g>

  <!-- QTRON text -->
  <text x="60" y="28" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#1a1a1a" letter-spacing="1">QTRON</text>

  <!-- INVESTMENTS text -->
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="9" fill="#666666" letter-spacing="3">INVESTMENTS</text>
</svg>
